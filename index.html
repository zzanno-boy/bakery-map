<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>서울 빵집 지도</title>
<meta name="description" content="서울 빵집을 지도와 목록으로 찾고 즐겨찾기·메모를 남기는 앱">
<meta property="og:type" content="website">
<meta property="og:title" content="서울 빵집 지도">
<meta property="og:description" content="크림·초코 가득한 빵집 46곳. 홈 화면에 설치해서 쓰는 지도 앱">
<meta property="og:image" content="https://zzanno-boy.github.io/bakery-map/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="theme-color" content="#1C1612" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="빵집 지도">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;500;700;800&display=swap">
<style>
html{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
/* Layout: one-screen app. The map fills the stage; a draggable sheet (phone) or a left rail (desktop) carries the list and detail. */
:root{
  --paper:#FFFBF2; --paper-2:#F6EEDD; --paper-3:#EFE5CF;
  --ink:#2A1C13; --ink-2:#6E5A4B; --ink-3:#9C8B7B;
  --line:#E3D7C0; --line-2:#D2C3A5;
  --land-a:#F2E6CC; --land-b:#EADCBC; --land-c:#F7EDD8; --outside:#E7E0D1;
  --gu-line:#CDBB97; --dong-line:#DBCEAD; --label:#6E5A4B; --label-halo:#F4E9D2;
  --water:#9CC6C1; --water-2:#B5D6D1;
  --accent:#E79A1C; --accent-2:#F7D27A; --accent-ink:#2A1C13; --focus:#2F6BB3;
  --ok:#3E8E5B; --danger:#B8402E;
  --c-cream:#F0AE2B; --c-choco:#5A3A2B; --c-salt:#DE5F2C; --c-loaf:#7B9A45; --c-old:#2E6B8F; --c-sweet:#B4457B; --c-cafe:#6C6A9E;
  --pin-ring:#FFFDF7;
  --shadow:0 10px 30px rgba(70,45,20,.18); --shadow-s:0 2px 8px rgba(70,45,20,.12);
  --font-display:'Do Hyeon','Gothic A1','Apple SD Gothic Neo',system-ui,sans-serif;
  --font-body:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --head-h:136px; --rail-w:400px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C1612; --paper-2:#251E18; --paper-3:#2E2620;
    --ink:#F2E8D8; --ink-2:#C4B4A2; --ink-3:#8F7F6F;
    --line:#3A2F27; --line-2:#4B3E33;
    --land-a:#2B231C; --land-b:#322921; --land-c:#271F19; --outside:#1F1915;
    --gu-line:#4E4034; --dong-line:#3C3129; --label:#B9A893; --label-halo:#2B231C;
    --water:#2C4B49; --water-2:#305250;
    --accent:#F2B942; --accent-2:#5E4414; --accent-ink:#1C1612; --focus:#7FB2F0;
    --ok:#6DBB86; --danger:#E07A66;
    --c-cream:#F2B942; --c-choco:#B5805F; --c-salt:#EE7B49; --c-loaf:#9CBB63; --c-old:#5FA0CB; --c-sweet:#D46CA0; --c-cafe:#9290C9;
    --pin-ring:#1C1612;
    --shadow:0 10px 30px rgba(0,0,0,.5); --shadow-s:0 2px 8px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1C1612; --paper-2:#251E18; --paper-3:#2E2620;
  --ink:#F2E8D8; --ink-2:#C4B4A2; --ink-3:#8F7F6F;
  --line:#3A2F27; --line-2:#4B3E33;
  --land-a:#2B231C; --land-b:#322921; --land-c:#271F19; --outside:#1F1915;
  --gu-line:#4E4034; --dong-line:#3C3129; --label:#B9A893; --label-halo:#2B231C;
  --water:#2C4B49; --water-2:#305250;
  --accent:#F2B942; --accent-2:#5E4414; --accent-ink:#1C1612; --focus:#7FB2F0;
  --ok:#6DBB86; --danger:#E07A66;
  --c-cream:#F2B942; --c-choco:#B5805F; --c-salt:#EE7B49; --c-loaf:#9CBB63; --c-old:#5FA0CB; --c-sweet:#D46CA0; --c-cafe:#9290C9;
  --pin-ring:#1C1612;
  --shadow:0 10px 30px rgba(0,0,0,.5); --shadow-s:0 2px 8px rgba(0,0,0,.4);
  color-scheme:dark;
}

html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;overflow:hidden;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
ul{list-style:none;margin:0;padding:0}

#app{height:100%;position:relative}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--outside)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block;cursor:grab}
#map.dragging{cursor:grabbing}

/* header */
.top{position:absolute;top:0;left:0;right:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:24px;letter-spacing:.01em;line-height:1.1}
.brand .count{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.brand .spacer{flex:1}
.brand .meta-btn{font-size:12px;color:var(--ink-2);padding:4px 8px;border-radius:8px;border:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:0 10px;height:40px}
.search svg{flex:none;width:16px;height:16px;color:var(--ink-3)}
.search input{flex:1;min-width:0;background:none;border:0;height:100%;outline:none;font-size:15px}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button{display:none}
.search button{width:24px;height:24px;border-radius:50%;color:var(--ink-3);font-size:18px;line-height:1;background:var(--paper-3)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink-2);font-size:12.5px;font-weight:500;white-space:nowrap}
.chip .sw{width:8px;height:8px;border-radius:50%;background:var(--sw,var(--ink-3))}
.chip .n{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:11px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip[aria-pressed="true"] .n{color:var(--paper);opacity:.7}

/* sheet / rail */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;height:calc(100% - var(--head-h));background:var(--paper);
  border-radius:18px 18px 0 0;box-shadow:0 -6px 28px rgba(70,45,20,.16);display:flex;flex-direction:column;will-change:transform;
  transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.nosnap{transition:none}
.handle{flex:none;height:26px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.handle span{width:40px;height:5px;border-radius:3px;background:var(--line-2)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column}
.list-head{flex:none;display:flex;align-items:center;gap:8px;padding:0 16px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12px;color:var(--ink-3)}
.list-head .spacer{flex:1}
.list-head button{font-size:12px;color:var(--ink-2);padding:4px 8px;border-radius:8px;border:1px solid var(--line)}
.list-head button[aria-pressed="true"]{background:var(--paper-3);border-color:var(--line-2);color:var(--ink)}
#list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.row{display:grid;grid-template-columns:14px 1fr auto;column-gap:12px;align-items:start;width:100%;text-align:left;padding:11px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--paper-2)}
.row.is-sel{background:var(--paper-2)}
.row .dot{width:12px;height:12px;border-radius:50%;margin-top:5px;background:var(--c);box-shadow:0 0 0 2px var(--pin-ring)}
.row .main{display:flex;flex-direction:column;min-width:0}
.row .name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;min-width:0}
.row .name .fav{color:var(--c-sweet);font-size:13px}
.row .name .vis{color:var(--ok);font-size:12px;font-weight:500}
.row .sub{color:var(--ink-3);font-size:12px;margin-top:1px}
.row .items{color:var(--ink-2);font-size:12.5px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.row .dist{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-2);line-height:1.3;white-space:nowrap}
.row .dist b{display:block;font-weight:700;color:var(--ink)}
.empty{padding:28px 20px;color:var(--ink-3);text-align:center;font-size:13px}
.empty b{display:block;color:var(--ink-2);font-weight:700;margin-bottom:4px}
.hidden-note{padding:10px 16px 16px;text-align:center}
.hidden-note button{font-size:12px;color:var(--ink-3);text-decoration:underline}

/* detail */
.detail{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px max(20px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.d-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.icon-btn{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--paper-2);color:var(--ink-2);border:1px solid var(--line)}
.icon-btn svg{width:18px;height:18px}
.d-top .spacer{flex:1}
.d-name{font-family:var(--font-display);font-weight:400;font-size:27px;line-height:1.15;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.d-name .swatch{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--pin-ring)}
.d-meta{color:var(--ink-2);font-size:13px;margin-top:4px}
.d-meta .since{color:var(--ink-3)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--ink-2);padding:3px 8px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line)}
.tag .sw{width:7px;height:7px;border-radius:50%;background:var(--sw)}
.d-sec{margin-top:16px}
.d-sec h3{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;margin-bottom:6px}
.bread-list{display:flex;flex-wrap:wrap;gap:6px}
.bread{font-size:13px;padding:5px 10px;border-radius:9px;background:var(--paper-2);border:1px solid var(--line)}
.bread.hit{background:var(--accent-2);border-color:transparent;font-weight:700}
.d-note{color:var(--ink-2);font-size:13.5px}
.addr{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.addr .t{flex:1;min-width:0;user-select:text;-webkit-user-select:text}
.addr .approx{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.mini-btn{font-size:11.5px;font-weight:700;color:var(--ink-2);padding:4px 8px;border-radius:7px;border:1px solid var(--line);background:var(--paper);white-space:nowrap}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.act{display:flex;align-items:center;justify-content:center;gap:7px;height:42px;border-radius:12px;border:1px solid var(--line-2);background:var(--paper);font-weight:700;font-size:13.5px;color:var(--ink);text-decoration:none}
.act svg{width:16px;height:16px}
.act[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.act.link{background:var(--paper-2)}
.act.wide{grid-column:1/-1}
textarea.memo{width:100%;min-height:72px;resize:vertical;border:1px solid var(--line-2);border-radius:12px;background:var(--paper-2);padding:10px 12px;font-size:13.5px;line-height:1.45}
textarea.memo::placeholder{color:var(--ink-3)}
.manage{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line-2)}
.manage button{font-size:12.5px;color:var(--ink-2);padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--paper)}
.manage button.danger{color:var(--danger)}
.confirm{margin-top:10px;padding:12px;border-radius:12px;background:var(--paper-2);border:1px solid var(--line-2);font-size:13px}
.confirm .btns{display:flex;gap:8px;margin-top:8px}
.btn{height:40px;padding:0 16px;border-radius:11px;font-weight:700;font-size:14px;background:var(--paper-3);color:var(--ink);border:1px solid var(--line-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}

/* form */
.form{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px max(20px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.form h2{font-family:var(--font-display);font-weight:400;font-size:22px}
.form .hint{display:flex;gap:10px;align-items:flex-start;background:var(--accent-2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink);margin:10px 0 4px}
.form .hint svg{flex:none;width:18px;height:18px;margin-top:1px}
.field{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.field label{font-size:12px;font-weight:700;color:var(--ink-2)}
.field label small{font-weight:400;color:var(--ink-3)}
.field input,.field select,.field textarea{height:42px;border:1px solid var(--line-2);border-radius:11px;background:var(--paper-2);padding:0 12px;font-size:14px;width:100%}
.field textarea{height:auto;min-height:64px;padding:10px 12px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.tagpick label{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper);font-size:12.5px;font-weight:500;cursor:pointer}
.tagpick input{position:absolute;opacity:0;width:0;height:0}
.tagpick label:has(input:checked){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tagpick .sw{width:8px;height:8px;border-radius:50%;background:var(--sw)}
.form-btns{display:flex;gap:8px;margin-top:18px}
.form-btns .btn{flex:1}
.err{color:var(--danger);font-size:12.5px;margin-top:8px}

/* map ui */
.map-ctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--sheet-vis,128px) + 14px);z-index:5;display:flex;flex-direction:column;gap:6px;transition:bottom .28s cubic-bezier(.2,.8,.2,1)}
.map-ctl button{width:40px;height:40px;border-radius:12px;background:var(--paper);box-shadow:var(--shadow-s);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.map-ctl button svg{width:18px;height:18px}
.scale{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(var(--sheet-vis,128px) + 14px);z-index:5;display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;pointer-events:none;transition:bottom .28s cubic-bezier(.2,.8,.2,1)}
.scale .bar{height:4px;border:2px solid var(--ink-2);border-top:0;width:100px}
.scale .lab{padding:0 2px}
#fab{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sheet-vis,128px) + 14px);z-index:5;height:42px;padding:0 16px 0 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;transition:bottom .28s cubic-bezier(.2,.8,.2,1)}
#fab svg{width:18px;height:18px}
#crosshair{position:absolute;left:0;top:0;width:0;height:0;z-index:4;pointer-events:none}
#crosshair .ring{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;border:2.5px solid var(--accent);box-shadow:0 0 0 3px var(--paper),0 4px 14px rgba(0,0,0,.25)}
#crosshair .pin{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--paper)}
#crosshair .tip{position:absolute;left:50%;top:26px;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--paper);font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:8px}
.map-hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--head-h) + 12px);z-index:5;background:var(--ink);color:var(--paper);font-size:12.5px;padding:7px 12px;border-radius:10px;box-shadow:var(--shadow-s);max-width:calc(100% - 32px);text-align:center}
#toast{position:absolute;left:50%;transform:translateX(-50%) translateY(10px);bottom:calc(var(--sheet-vis,128px) + 66px);z-index:9;background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* svg map styling */
.land path{stroke:var(--gu-line);stroke-width:1.1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.land path.a{fill:var(--land-a)} .land path.b{fill:var(--land-b)} .land path.c{fill:var(--land-c)}
.dongs path{fill:none;stroke:var(--dong-line);stroke-width:.7;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .25s}
.rivers .han{fill:none;stroke:var(--water);stroke-linecap:round;stroke-linejoin:round}
.rivers .saet{fill:none;stroke:var(--water-2);stroke-linecap:round;stroke-linejoin:round}
.rivers .trib{fill:none;stroke:var(--water-2);stroke-linecap:round;stroke-linejoin:round}
.lbl text{font-family:var(--font-display);fill:var(--label);text-anchor:middle;paint-order:stroke;stroke:var(--label-halo);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.lbl-gu text{font-size:13px;letter-spacing:.08em;opacity:.85}
.lbl-area text{font-family:var(--font-body);font-weight:700;font-size:11px;fill:var(--ink-2);letter-spacing:.02em}
.lbl{transition:opacity .2s}
.pin{cursor:pointer}
.pin .body{fill:var(--c);stroke:var(--pin-ring);stroke-width:1.6;stroke-linejoin:round}
.pin .core{fill:var(--pin-ring)}
.pin .name{font-family:var(--font-body);font-weight:700;font-size:11.5px;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.pin .heart{fill:var(--c-sweet);stroke:var(--pin-ring);stroke-width:1}
.pin .check{fill:var(--ok);stroke:var(--pin-ring);stroke-width:1}
.pin.is-sel .body{stroke:var(--accent);stroke-width:3}
.pin.is-sel .name{font-size:12.5px}
.pin.dim{opacity:.35}
.cluster{cursor:pointer}
.cluster circle{fill:var(--ink);stroke:var(--paper);stroke-width:2}
.cluster text{font-family:var(--font-display);fill:var(--paper);font-size:13px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.cluster .ring{fill:none;stroke:var(--ink);opacity:.22;stroke-width:6}

/* settings */
.settings{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px max(20px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.settings h2{font-family:var(--font-display);font-weight:400;font-size:22px}
.s-sec{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line-2)}
.s-sec:first-of-type{border-top:0;padding-top:0}
.s-sec h3{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;margin-bottom:6px}
.s-sec p{margin:0 0 8px;color:var(--ink-2);font-size:13.5px}
.s-sec ol{margin:6px 0 0;padding-left:18px;color:var(--ink-2);font-size:13.5px}
.s-sec ol li{margin:3px 0}
.s-btns{display:flex;flex-wrap:wrap;gap:8px}
.s-sec textarea{width:100%;min-height:80px;border:1px solid var(--line-2);border-radius:12px;background:var(--paper-2);padding:10px 12px;font-size:12.5px;font-family:ui-monospace,Menlo,monospace;resize:vertical}
.s-stat{display:flex;gap:14px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.s-stat b{color:var(--ink);font-size:18px;display:block;font-family:var(--font-display);font-weight:400}
#install-bar{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--head-h) + 10px);z-index:5;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);padding:8px 10px 8px 14px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;max-width:calc(100% - 32px)}
#install-bar button{background:var(--accent);color:var(--accent-ink);font-weight:800;padding:6px 10px;border-radius:8px;font-size:12.5px;white-space:nowrap}
#install-bar .x{background:none;color:var(--paper);opacity:.7;font-size:18px;padding:0 4px}
@media (min-width:900px){#install-bar{left:calc(var(--rail-w) + (100% - var(--rail-w))/2);top:16px}}

/* install gate */
#gate{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(42,28,19,.42);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.gate-card{width:100%;max-width:440px;background:var(--paper);border-radius:22px 22px 0 0;padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:gate-up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes gate-up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.gate-head{display:flex;align-items:center;gap:12px}
.gate-head img{width:52px;height:52px;border-radius:13px;flex:none}
.gate-head h2{font-family:var(--font-display);font-weight:400;font-size:21px;line-height:1.15}
.gate-head p{margin:2px 0 0;color:var(--ink-3);font-size:12.5px}
.gate-title{margin-top:16px;font-size:16px;font-weight:800;line-height:1.3}
.gate-sub{margin:4px 0 0;color:var(--ink-2);font-size:13.5px;line-height:1.5}
.gate-steps{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.gate-steps li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:14px;line-height:1.45}
.gate-steps .n{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;margin-top:1px}
.gate-steps b{font-weight:800}
.gate-steps svg,.gate-note svg{width:17px;height:17px;vertical-align:-3px;margin:0 2px}
.gate-note svg{width:15px;height:15px}
.gate-steps .kbd,.gate-note .kbd{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--paper-3);border:1px solid var(--line-2);font-size:12.5px;font-weight:700;white-space:nowrap}
.gate-btn{margin-top:16px;width:100%;height:50px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.gate-btn svg{width:20px;height:20px}
.gate-btn.secondary{background:var(--paper-3);color:var(--ink);height:44px;font-size:14px;margin-top:8px}
.gate-note{margin:10px 0 0;color:var(--ink-3);font-size:12px;line-height:1.5}
.gate-later{margin-top:12px;width:100%;height:40px;color:var(--ink-3);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.gate-wait{display:flex;align-items:center;gap:8px;margin-top:16px;color:var(--ink-2);font-size:13.5px}
.gate-wait i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (min-width:600px){#gate{align-items:center;padding:20px}.gate-card{border-radius:22px;padding-bottom:18px}}
@media (prefers-reduced-motion:reduce){.gate-card{animation:none}.gate-wait i{animation:none}}

/* desktop */
@media (min-width:900px){
  .top{right:auto;width:var(--rail-w);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  #sheet{right:auto;width:var(--rail-w);top:var(--head-h);height:auto;border-radius:0;box-shadow:none;border-right:1px solid var(--line);transform:none!important;transition:none}
  .handle{display:none}
  .map-ctl,.scale,#fab,#toast{--sheet-vis:0px}
  .map-ctl{right:16px;bottom:16px}
  .scale{left:calc(var(--rail-w) + 16px);bottom:16px}
  #fab{bottom:calc(16px + 46px*3 + 6px*3)}
  .map-hint{left:calc(var(--rail-w) + (100% - var(--rail-w))/2);top:16px}
  #toast{left:calc(var(--rail-w) + (100% - var(--rail-w))/2);bottom:26px}
  #toast.show{transform:translateX(-50%) translateY(0)}
}
#stage.sheet-full .map-ctl,#stage.sheet-full .scale,#stage.sheet-full #fab,#stage.sheet-full #toast,#stage.sheet-full .map-hint,#stage.sheet-full #install-bar{opacity:0;pointer-events:none}
@media (min-width:900px){#stage.sheet-full .map-ctl,#stage.sheet-full .scale,#stage.sheet-full #fab,#stage.sheet-full #toast,#stage.sheet-full .map-hint,#stage.sheet-full #install-bar{opacity:1;pointer-events:auto}}
@media (prefers-reduced-motion:reduce){
  #sheet,.map-ctl,.scale,#fab,#toast,.lbl,.dongs path{transition:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="서울 빵집 지도">
      <g id="world">
        <g id="land" class="land"></g>
        <g id="dongs" class="dongs"><path id="dongpath" d=""/></g>
        <g id="rivers" class="rivers"></g>
        <g id="gu-labels"></g>
        <g id="area-labels"></g>
        <g id="pins"></g>
        <g id="clusters"></g>
      </g>
    </svg>

    <header class="top">
      <div class="brand">
        <h1>서울 빵집 지도</h1>
        <span class="count" id="count"></span>
        <span class="spacer"></span>
        <button class="meta-btn" id="sort-toggle" aria-pressed="false" title="목록 정렬 바꾸기">가까운 순</button>
        <button class="meta-btn" id="settings-btn" aria-label="설정" title="설정">⚙</button>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="빵집, 동네, 빵 이름으로 찾기" autocomplete="off" aria-label="검색">
        <button id="q-clear" hidden aria-label="검색어 지우기">×</button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="필터"></div>
    </header>

    <div id="sheet">
      <div class="handle" id="handle" aria-hidden="true"><span></span></div>
      <section class="panel" id="panel-list" aria-label="빵집 목록">
        <div class="list-head"><span id="list-sub">지도 가운데에서 가까운 순</span><span class="spacer"></span><button id="inview-btn" aria-pressed="false">화면 안만</button></div>
        <ul id="list"></ul>
      </section>
      <section class="panel" id="panel-detail" hidden aria-label="빵집 상세"></section>
      <section class="panel" id="panel-form" hidden aria-label="빵집 추가"></section>
      <section class="panel" id="panel-settings" hidden aria-label="설정"></section>
    </div>

    <div class="map-ctl">
      <button id="zoom-in" aria-label="확대"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zoom-out" aria-label="축소"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button id="zoom-fit" aria-label="서울 전체 보기" title="서울 전체 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
    </div>
    <div class="scale" id="scale" aria-hidden="true"><span class="lab" id="scale-lab">1 km</span><div class="bar" id="scale-bar"></div></div>
    <button id="fab" aria-label="빵집 추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>빵집 추가</button>
    <div id="crosshair" hidden><div class="ring"></div><div class="pin"></div><div class="tip" id="crosshair-tip">여기에 놓기</div></div>
    <div class="map-hint" id="map-hint" hidden></div>
    <div id="install-bar" hidden><span>홈 화면에 앱으로 설치할 수 있어요</span><button id="install-go">설치</button><button class="x" id="install-x" aria-label="닫기">×</button></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="gate" hidden role="dialog" aria-modal="true" aria-labelledby="gate-h">
      <div class="gate-card">
        <div class="gate-head"><img src="./icons/icon-192.png" alt="" width="52" height="52"><div><h2 id="gate-h">서울 빵집 지도</h2><p>홈 화면에 앱으로 설치해서 써요</p></div></div>
        <div id="gate-body"></div>
        <button class="gate-later" id="gate-later">나중에 할게요, 먼저 둘러볼래요</button>
      </div>
    </div>
  </div>
</div>

function applyScale() {

}

  const m = 0.15;
  const ncx = Math.min(WORLD.w * (1 + m), Math.max(-WORLD.w * m, cx));
  const ncy = Math.min(WORLD.h * (1 + m), Math.max(-WORLD.h * m, cy));

let reclusterT, movedT;

function fitBounds(x0, y0, x1, y1, pad = 40, animate = false) {
  const ins = mapInsets();
  const aw = view.cw - ins.l - pad * 2, ah = view.ch - ins.t - ins.b - pad * 2;

/* ───────────── clustering ───────────── */
function recluster() {
  const cg = $('#clusters'); cg.replaceChildren();
  fixedEls = fixedEls.filter(f => f.kind !== 'cluster');
  const vis = visiblePlaces();
  const visSet = new Set(vis.map(p => p.id));
  for (const [id, el] of pinEls) el.style.display = visSet.has(id) ? '' : 'none';
  const z = zoomLevel();
  const R = z >= 60 ? 0 : z >= 50 ? 14 : 24;
  const clusters = [];
  for (const p of vis) {
    const [x, y] = proj(p.lat, p.lng); const sx = x * view.k + view.tx, sy = y * view.k + view.ty;
    let c = clusters.find(c => Math.hypot(c.sx - sx, c.sy - sy) < R);
    if (c) { c.m.push(p); c.sx = (c.sx * (c.m.length - 1) + sx) / c.m.length; c.sy = (c.sy * (c.m.length - 1) + sy) / c.m.length; }
    else clusters.push({ sx, sy, m: [p] });
  }
  for (const c of clusters) {
    if (c.m.length < 2 || c.m.some(p => p.id === ui.sel)) continue;
    c.m.forEach(p => pinEls.get(p.id).style.display = 'none');
    const wx = (c.sx - view.tx) / view.k, wy = (c.sy - view.ty) / view.k;
    const r = c.m.length > 9 ? 17 : 14;
    const grp = mk('g', { class: 'cluster' }, cg);
    mk('circle', { class: 'ring', r: r + 4 }, grp);
    mk('circle', { r }, grp);
    mk('text', {}, grp).textContent = c.m.length;
    grp.addEventListener('click', e => { e.stopPropagation(); fitPlaces(c.m); });
    grp._members = c.m;
    fixedEls.push({ el: grp, x: wx, y: wy, kind: 'cluster' });
    grp.setAttribute('transform', `translate(${wx} ${wy}) scale(${1 / view.k})`);
  }
}

/* ───────────── pointer interaction ───────────── */
const pointers = new Map();
let gesture = null, lastTap = { t: 0, x: 0, y: 0 };
function spos(e) { const r = svg.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
svg.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  svg.setPointerCapture(e.pointerId);
  const [x, y] = spos(e); pointers.set(e.pointerId, { x, y });
  if (pointers.size === 1) gesture = { x, y, tx: view.tx, ty: view.ty, t: performance.now(), moved: false, target: e.target };

    const f = Math.min(view.k0 * 70, Math.max(view.k0 * .7, gesture.k * d / gesture.d)) / gesture.k;
    setView(gesture.k * f, mx - (gesture.mx - gesture.tx) * f, my - (gesture.my - gesture.ty) * f);

    if (!gesture.moved && Math.hypot(dx, dy) > 5) gesture.moved = true;

/* ───────────── filtering ───────────── */
function matches(p) {

}
function visiblePlaces() { return PLACES.filter(matches); }

/* ───────────── chips ───────────── */

  const favN = PLACES.filter(p => isFav(p.id)).length, visN = PLACES.filter(p => isVisited(p.id)).length, mineN = PLACES.filter(p => !p.base).length;

      const keepPos = Math.abs(p.lat - data.lat) < 1e-4 && Math.abs(p.lng - data.lng) < 1e-4;
      const patch = Object.assign({}, data); if (keepPos) { delete patch.lat; delete patch.lng; }
      await saveEdit(p.id, patch); $('#crosshair').hidden = true; showHint(null); ui.formFor = null; setMode('detail'); renderDetail(); toast('수정했어요');
    } else {
      await savePlace(p.id, Object.assign({ createdAt: store.places[p.id]?.createdAt }, data)); $('#crosshair').hidden = true; showHint(null); ui.formFor = null; setMode('detail'); renderDetail(); toast('수정했어요');
    }
  });
  setTimeout(() => $('#f-name')?.focus({ preventScroll: true }), 300);
}
function updateCrosshair() {
  const c = $('#crosshair'); if (c.hidden) return;
  const ins = mapInsets();
  c.style.left = (ins.l + (view.cw - ins.l) / 2) + 'px'; c.style.top = (ins.t + (view.ch - ins.t - ins.b) / 2) + 'px';
}
function showHint(msg) { const h = $('#map-hint'); if (!msg) { h.hidden = true; return; } h.textContent = msg; h.hidden = false; }

/* ───────────── sheet (phone) ───────────── */
const sheet = $('#sheet');
function sheetVisible() {
  if (isDesktop()) return 0;
  const h = sheet.offsetHeight;
  return ui.sheet === 'full' ? h : ui.sheet === 'half' ? Math.round(h * .5) : 128;
}
function updateSheetVar() { stage.style.setProperty('--sheet-vis', sheetVisible() + 'px'); }
function setSheet(s) {
  ui.sheet = s; stage.classList.toggle('sheet-full', s === 'full' && !isDesktop()); if (isDesktop()) return;
  const h = sheet.offsetHeight, vis = sheetVisible();
  sheet.classList.remove('nosnap'); sheet.style.transform = `translateY(${h - vis}px)`;
  updateSheetVar(); updateCrosshair();
}
(() => {
  let drag = null;
  const onDown = e => { if (isDesktop()) return; drag = { y: e.clientY, start: sheetVisible(), t: performance.now() }; sheet.classList.add('nosnap'); $('#handle').setPointerCapture(e.pointerId); };
  const onMove = e => { if (!drag) return; const h = sheet.offsetHeight; const vis = Math.max(128, Math.min(h, drag.start + (drag.y - e.clientY))); sheet.style.transform = `translateY(${h - vis}px)`; drag.cur = vis; };
  const onUp = e => {
    if (!drag) return; const h = sheet.offsetHeight; const vis = drag.cur ?? drag.start; const dy = drag.y - e.clientY; const fast = performance.now() - drag.t < 250 && Math.abs(dy) > 30;
    let next;
    if (fast) next = dy > 0 ? (ui.sheet === 'peek' ? 'half' : 'full') : (ui.sheet === 'full' ? 'half' : 'peek');
    else { const d = [['peek', 128], ['half', h * .5], ['full', h]]; next = d.reduce((a, b) => Math.abs(b[1] - vis) < Math.abs(a[1] - vis) ? b : a)[0]; }
    drag = null; setSheet(next);
  };
  const hd = $('#handle');
  hd.addEventListener('pointerdown', onDown); hd.addEventListener('pointermove', onMove); hd.addEventListener('pointerup', onUp); hd.addEventListener('pointercancel', onUp);
  hd.addEventListener('click', () => { if (isDesktop()) return; if (ui.sheet === 'peek') setSheet('half'); });
  $('#list-sub').addEventListener('click', () => { if (!isDesktop() && ui.sheet === 'peek') setSheet('half'); });
})();

/* ───────────── refresh ───────────── */
function refreshData() {
  PLACES = allPlaces();
  if (ui.sel && !byId(ui.sel)) { ui.sel = null; if (ui.mode === 'detail') setMode('list'); }
  renderChips(); buildPins();
  if (ui.sel && pinEls.get(ui.sel)) { const el = pinEls.get(ui.sel); el.classList.add('is-sel'); el.parentNode.appendChild(el); }
  refreshView();
  if (ui.mode === 'detail') renderDetail();
}
function refreshView() { renderList(); recluster(); applyScale(); }

/* ───────────── wiring ───────────── */
$('#q').addEventListener('input', e => { ui.q = e.target.value.trim(); $('#q-clear').hidden = !ui.q; clearTimeout($('#q')._t); $('#q')._t = setTimeout(() => { refreshView(); if (ui.q) { const v = visiblePlaces(); if (v.length && v.length <= 12 && !v.some(p => isInView(p.lat, p.lng))) fitPlaces(v); if (!isDesktop() && ui.sheet === 'peek') setSheet('half'); } }, 150); });
$('#q-clear').addEventListener('click', () => { $('#q').value = ''; ui.q = ''; $('#q-clear').hidden = true; refreshView(); $('#q').focus(); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.target.blur(); } });
$('#sort-toggle').addEventListener('click', e => { ui.sort = ui.sort === 'near' ? 'name' : 'near'; e.currentTarget.textContent = ui.sort === 'near' ? '가까운 순' : '이름순'; e.currentTarget.setAttribute('aria-pressed', ui.sort === 'name'); renderList(); });
$('#inview-btn').addEventListener('click', e => { ui.inview = !ui.inview; e.currentTarget.setAttribute('aria-pressed', ui.inview); renderList(); });
$('#fab').addEventListener('click', () => { if (ui.mode === 'detail') deselect(); openForm(null); });
window.addEventListener('resize', () => { const wasDesktop = isDesktop(); resize(); setSheet(isDesktop() ? ui.sheet : ui.sheet); applyView(); updateCrosshair(); clearTimeout(reclusterT); reclusterT = setTimeout(recluster, 60); });

/* ───────────── boot ───────────── */
function boot(saved) {
  buildMap(); resize();
  if (saved && saved.view && saved.cw === view.cw && saved.ch === view.ch) { view.k = saved.view.k; view.tx = saved.view.tx; view.ty = saved.view.ty; }
  else fitPlaces(PLACES);
  ui.filter = saved?.filter || 'all'; ui.sort = saved?.sort || 'near';
  renderChips(); buildPins(); renderList(); applyView(); applyScale();
  setMode('list'); setSheet(saved?.sheet || 'peek');
  if (saved?.sel && byId(saved.sel)) select(saved.sel, { pan: false });
}
if (document.fonts?.ready) document.fonts.ready.then(() => { applyScale(); });

/* ───────────── settings (내보내기·가져오기·설치) ───────────── */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; const g = $('#gate'); if (g && !g.hidden && g.dataset.mode === 'android') openGate(true); else if (isDesktop() && !LS.get('bb.installDismissed', false) && !isStandalone()) $('#install-bar').hidden = false; });
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream;
$('#install-go').addEventListener('click', async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('#install-bar').hidden = true; });
$('#install-x').addEventListener('click', () => { $('#install-bar').hidden = true; LS.set('bb.installDismissed', true); });
function exportText() { return JSON.stringify({ v: 1, places: store.places, edits: store.edits, mine: store.mine }); }
function importText(txt) {
  const d = JSON.parse(txt); if (!d || d.v !== 1) throw new Error('bad');
  let n = 0;
  for (const id in d.places || {}) { if (!store.places[id]) n++; store.places[id] = d.places[id]; }
  for (const id in d.edits || {}) store.edits[id] = Object.assign({}, store.edits[id] || {}, d.edits[id]);
  for (const k of ['favs', 'visited', 'notes']) Object.assign(store.mine[k], (d.mine || {})[k] || {});
  LS.set('bb.places', store.places); LS.set('bb.edits', store.edits); LS.set('bb.mine', store.mine); refreshData(); return n;
}
function openSettings() {
  if (ui.mode === 'form') return;
  const el = $('#panel-settings');
  const mineN = Object.keys(store.places).length, favN = Object.keys(store.mine.favs).length, visN = Object.keys(store.mine.visited).length;
  const installHelp = (isStandalone() ? '<p>이 폰에는 이미 앱으로 설치되어 있어요.</p>' : '<p>홈 화면에 넣으면 전체 화면으로 열리고, 인터넷이 안 되는 곳에서도 열려요.</p><div class="s-btns"><button class="btn primary" id="s-gate">설치 방법 보기</button></div>')
    + '<p style="margin-top:12px">여자친구 폰에도 깔려면 아래 글을 카톡으로 보내 주세요. 링크를 열면 같은 설치 안내가 떠요.</p><div class="s-btns"><button class="btn" id="s-applink">앱 링크 복사</button></div>';
  el.innerHTML = `
    <div class="settings">
      <div class="d-top"><button class="icon-btn" id="s-back" aria-label="돌아가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2>설정</h2></div>
      <div class="s-sec"><h3>이 폰에 저장된 것</h3><div class="s-stat"><span><b>${mineN}</b>추가한 빵집</span><span><b>${favN}</b>즐겨찾기</span><span><b>${visN}</b>가본 곳</span></div></div>
      <div class="s-sec"><h3>앱으로 설치</h3>${installHelp}</div>
      <div class="s-sec"><h3>다른 폰과 맞추기</h3><p>즐겨찾기·메모·추가한 빵집은 이 폰에만 저장돼요. 아래 글을 복사해 카톡으로 보내고, 받은 폰에서 붙여 넣으면 합쳐져요.</p>
        <div class="s-btns"><button class="btn" id="s-export">내 기록 복사</button></div>
        <textarea id="s-import" placeholder="받은 글을 여기에 붙여 넣으세요" aria-label="가져올 기록"></textarea>
        <div class="s-btns" style="margin-top:8px"><button class="btn primary" id="s-import-go">가져오기</button></div>
        <div class="err" id="s-err" hidden></div>
      </div>
      <div class="s-sec"><h3>기본 목록</h3><p>빵집 ${BASE.length}곳 · 새 목록이 올라오면 인터넷에 연결됐을 때 자동으로 받아요.</p><div class="s-btns"><button class="btn" id="s-refresh">지금 새로고침</button></div></div>
    </div>`;
  setMode('settings');
  if (!isDesktop()) setSheet('full');
  $('#s-back').addEventListener('click', () => { deselect(); if (!isDesktop()) setSheet('half'); });
  $('#s-export').addEventListener('click', () => copyText(exportText(), '복사했어요. 카톡에 붙여 넣어 보내세요'));
  $('#s-import-go').addEventListener('click', () => { const err = $('#s-err'); err.hidden = true; try { const n = importText($('#s-import').value.trim()); toast(`가져왔어요 (새 빵집 ${n}곳)`); $('#s-import').value = ''; openSettings(); } catch { err.textContent = '붙여 넣은 글을 읽을 수 없어요. "내 기록 복사"로 만든 글인지 확인해 주세요.'; err.hidden = false; } });
  $('#s-refresh').addEventListener('click', () => loadBase(true).then(ok => toast(ok ? '목록을 새로 받았어요' : '지금은 받을 수 없어요')));
  const sg = $('#s-gate'); if (sg) sg.addEventListener('click', () => { if (!openGate(true)) toast('이 기기에서는 브라우저 메뉴의 "홈 화면에 추가"를 써 주세요'); });
  $('#s-applink').addEventListener('click', () => copyText(SHARE_TEXT(), '복사했어요. 카톡에 붙여 넣어 보내세요'));
}
$('#settings-btn').addEventListener('click', () => { if (ui.mode === 'settings') { deselect(); if (!isDesktop()) setSheet('half'); } else openSettings(); });

/* ───────────── 설치 안내 (카톡 안에서 열렸을 때 / 안드로이드 / 아이폰) ───────────── */
const UA = navigator.userAgent;
const ENV = {
  ios: /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  android: /Android/.test(UA),
  kakao: /KAKAOTALK/i.test(UA),
  inapp: /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|FB_IAB|Line\/|DaumApps|; wv\)/i.test(UA),
  crios: /CriOS/.test(UA),
  samsung: /SamsungBrowser/.test(UA)
};
const cleanUrl = () => location.origin + location.pathname;
const SHARE_TEXT = () => `🍞 서울 빵집 지도\n${cleanUrl()}\n링크를 열고 → "브라우저로 열기" → "설치"를 누르면 홈 화면에 앱으로 깔려요.`;
const ICON_SHARE_IOS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg>';
const ICON_PLUS_SQ = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg>';
const ICON_DOTS = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
const ICON_OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>';
const ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>';
function openExternal() {
  const u = cleanUrl();
  if (ENV.android) {
    // 카톡·네이버 등 안드로이드 내장 브라우저 → Chrome 으로
    location.href = 'intent://' + location.host + location.pathname + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(u) + ';end';
  } else if (ENV.kakao) {
    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(u);
  }
}
function gateMode() {
  if (isStandalone()) return null;
  if (ENV.kakao) return 'kakao';
  if (ENV.inapp) return 'inapp';
  if (ENV.android) return 'android';
  if (ENV.ios) return 'ios';
  return null;
}
function gateBodyHtml(mode) {
  const li = (n, s) => `<li><span class="n">${n}</span><span>${s}</span></li>`;
  if (mode === 'kakao' || mode === 'inapp') {
    const where = ENV.kakao ? '카카오톡' : '지금 쓰는 앱';
    const browser = ENV.android ? 'Chrome' : 'Safari';
    const btn = (ENV.android || ENV.kakao) ? `<button class="gate-btn" id="gate-ext">${ICON_OUT}${browser}으로 열기</button>` : '';
    const manual = ENV.android
      ? `안 열리면: 오른쪽 위(또는 아래) ${ICON_DOTS} 메뉴 → <span class="kbd">다른 브라우저로 열기</span>`
      : `안 열리면: 아래 ${ICON_SHARE_IOS} 또는 ${ICON_DOTS} 메뉴 → <span class="kbd">Safari로 열기</span>`;
    return `<div class="gate-title">${where} 안에서는 설치가 안 돼요</div><p class="gate-sub">${browser}에서 열면 바로 설치할 수 있어요.</p>${btn}<p class="gate-note">${manual}</p>`;
  }
  if (mode === 'android') {
    if (installEvt) return `<div class="gate-title">한 번만 누르면 홈 화면에 들어가요</div><p class="gate-sub">인터넷이 안 되는 곳에서도 열리고, 주소창 없이 전체 화면으로 떠요.</p><button class="gate-btn" id="gate-install">${ICON_DL}앱 설치</button>`;
    const menu = ENV.samsung
      ? li(1, `아래 <span class="kbd">≡</span> 메뉴 → <b>현재 페이지 추가</b> → <b>홈 화면</b>`)
      : li(1, `오른쪽 위 ${ICON_DOTS} 메뉴 → <b>홈 화면에 추가</b> (또는 <b>앱 설치</b>)`);
    return `<div class="gate-title">홈 화면에 추가하면 앱처럼 열려요</div><div class="gate-wait" id="gate-wait"><i></i>설치 버튼을 준비하고 있어요…</div><ol class="gate-steps" id="gate-manual" hidden>${menu}${li(2, `<b>설치</b> 또는 <b>추가</b> 누르기`)}</ol><p class="gate-note" id="gate-manual-note" hidden>이미 설치했다면 홈 화면의 "빵집 지도" 아이콘으로 열어 주세요.</p>`;
  }
  if (mode === 'ios') {
    const first = ENV.crios
      ? li(1, `오른쪽 위 ${ICON_SHARE_IOS} <b>공유</b> 버튼`)
      : li(1, `아래 가운데 ${ICON_SHARE_IOS} <b>공유</b> 버튼`);
    return `<div class="gate-title">세 번만 누르면 홈 화면에 들어가요</div><p class="gate-sub">아이폰은 Safari의 공유 메뉴로 설치해요.</p><ol class="gate-steps">${first}${li(2, `아래로 내려서 ${ICON_PLUS_SQ} <b>홈 화면에 추가</b>`)}${li(3, `오른쪽 위 <b>추가</b>`)}</ol>${ENV.crios ? '' : '<p class="gate-note">공유 메뉴가 안 보이면 화면을 살짝 위로 올려 보세요.</p>'}<button class="gate-btn secondary" id="gate-ok">알겠어요</button>`;
  }
  return '';
}
let gateManualT;
function openGate(force) {
  const mode = gateMode(); if (!mode) return false;
  const snoozed = LS.get('bb.gateSnooze', 0);
  if (!force && snoozed && Date.now() - snoozed < 3 * 86400e3) return false;
  const g = $('#gate'); $('#gate-body').innerHTML = gateBodyHtml(mode); g.hidden = false; g.dataset.mode = mode;
  const ext = $('#gate-ext'); if (ext) ext.addEventListener('click', openExternal);
  const ins = $('#gate-install'); if (ins) ins.addEventListener('click', async () => { if (!installEvt) return; installEvt.prompt(); const r = await installEvt.userChoice; installEvt = null; if (r && r.outcome === 'accepted') { closeGate(); toast('설치했어요. 홈 화면에서 열어 보세요'); } });
  const ok = $('#gate-ok'); if (ok) ok.addEventListener('click', () => closeGate(true));
  clearTimeout(gateManualT);
  if (mode === 'android' && !installEvt) gateManualT = setTimeout(() => { const w = $('#gate-wait'); if (w) w.hidden = true; const m = $('#gate-manual'); if (m) m.hidden = false; const n = $('#gate-manual-note'); if (n) n.hidden = false; }, 2500);
  return true;
}
function closeGate(snooze) { $('#gate').hidden = true; if (snooze) LS.set('bb.gateSnooze', Date.now()); }
$('#gate-later').addEventListener('click', () => closeGate(true));
$('#gate').addEventListener('click', e => { if (e.target === e.currentTarget) closeGate(true); });

/* ───────────── base list + boot ───────────── */
async function loadBase(force) {
  try {
    const r = await fetch('./bakeries.json' + (force ? '?t=' + Date.now() : ''), { cache: force ? 'reload' : 'default' });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json(); if (!Array.isArray(data)) throw new Error('shape');
    BASE = data; LS.set('bb.base', data); refreshData(); return true;
  } catch { return false; }
}
(async () => {
  BASE = LS.get('bb.base', []);
  if (!BASE.length) { const ok = await loadBase(false); if (!ok) toast('기본 목록을 불러오지 못했어요. 인터넷을 확인해 주세요'); }
  else loadBase(false);
  boot(null);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  const force = location.hash === '#install'; if (force) history.replaceState(null, '', location.pathname);
  setTimeout(() => openGate(force), force ? 150 : 700);
})();
</script>
